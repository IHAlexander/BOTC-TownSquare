<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0d0d1a"/>
  <!-- Town square circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#8b0000" stroke-width="12"/>
  <!-- Clock tower -->
  <rect x="228" y="120" width="56" height="160" fill="#c41e3a" rx="4"/>
  <polygon points="256,80 228,120 284,120" fill="#ffd700"/>
  <!-- Clock face -->
  <circle cx="256" cy="200" r="22" fill="#0d0d1a" stroke="#ffd700" stroke-width="3"/>
  <line x1="256" y1="200" x2="256" y2="184" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="200" x2="268" y2="207" stroke="#ffd700" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Player seats around circle (8 dots) -->
  <circle cx="256" cy="70" r="10" fill="#c41e3a"/>
  <circle cx="390" cy="126" r="10" fill="#c41e3a"/>
  <circle cx="440" cy="256" r="10" fill="#c41e3a"/>
  <circle cx="390" cy="386" r="10" fill="#c41e3a"/>
  <circle cx="256" cy="440" r="10" fill="#c41e3a"/>
  <circle cx="122" cy="386" r="10" fill="#c41e3a"/>
  <circle cx="72" cy="256" r="10" fill="#c41e3a"/>
  <circle cx="122" cy="126" r="10" fill="#c41e3a"/>
</svg>
